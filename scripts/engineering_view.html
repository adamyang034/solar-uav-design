<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AircraftView | Engineering review</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="lib/review/review.css">
  <link rel="stylesheet" href="lib/review/review-mass.css">
  <script src="lib/chart.umd.min.js"></script>
  <script src="lib/review/lucide.min.js"></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <a class="brand" href="#overview"><i data-lucide="plane"></i><span>AircraftView<small>SOLAR UAV PROGRAM</small></span></a>
      <div class="nav-caption">DESIGN WORKSPACE</div>
      <nav id="navigation" aria-label="Main navigation"></nav>
      <div class="sidebar-bottom"><span class="snapshot-dot"></span>Calculated snapshot<small id="snapshot-date"></small><span class="revision">Engineering study · Rev 02</span></div>
    </aside>
    <div class="workspace">
      <header class="topbar"><div class="breadcrumb">Solar UAV <span>/</span> Design study <span>/</span> <b id="crumb">Overview</b></div>
        <div class="top-actions"><span class="snapshot-label">8 configurations</span><button class="icon-button" id="theme-toggle" title="Switch theme" aria-label="Switch theme"><i data-lucide="moon"></i></button>
        <div class="export-wrap"><button id="export-toggle" class="button" aria-expanded="false"><i data-lucide="download"></i>Export<i data-lucide="chevron-down"></i></button><div id="export-menu" class="menu" hidden><button data-export="json">Selected result · JSON</button><button data-export="csv">Comparison · CSV</button><button data-export="stl">Aircraft structure · STL</button></div></div></div>
      </header>
      <div class="context-bar"><label class="config-control"><span>Configuration</span><select id="config-select" aria-label="Aircraft configuration"></select></label>
        <fieldset class="battery-control"><legend>Battery option</legend><div id="battery-options" class="segmented"></div></fieldset>
        <div class="context-status" id="context-status"></div>
      </div>
      <main id="content" tabindex="-1"></main>
      <footer><span id="footer-source"></span><span>SI units unless noted · Analytical predictions</span></footer>
    </div>
  </div>
  <div id="notification" role="status" aria-live="polite"></div>
  <script>window.META = __META_JSON__; window.CONFIGS = __CONFIGS_JSON__;</script>
  <script type="module" src="lib/review/review.js"></script>
</body>
</html>
